services:
  searxng:
    image: searxng/searxng@sha256:cd8812607ab73730a0b1a0dc4990223fe1b9e383f6f35947114d0bef7f8bb441
    container_name: cacao-searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be set in .env}
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./config/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/search?format=json&q=health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.36.0
    container_name: cacao-gotenberg
    init: true
    command:
      - gotenberg
      - --api-timeout=60s
      - --chromium-max-concurrency=2
      - '--chromium-allow-list=^http://host\.docker\.internal:5173/'
      - '--chromium-allow-list=^http://host\.docker\.internal:5175/'
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3002}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  db:
    image: postgres:18.4
    container_name: cacao-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-cacao}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data:
