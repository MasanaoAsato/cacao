on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Setup
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: install golang-migrate
        run: brew install golang-migrate

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true

      - name: Install frontend dependencies
        run: mise run web:install

      # Golang
      - name: Golang
        run: |
          mise run lint
          mise run test

      # Frontend
      - name: Frontend
        run: |
          mise run web:check
          mise run web:typecheck
          mise run web:test
          mise run web:build
