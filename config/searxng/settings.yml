# Upstream defaults are retained except that searches are sent only to Bing.
# Google currently suspends automated SearXNG requests with CAPTCHA on this network.
use_default_settings:
  engines:
    keep_only:
      - bing

search:
  formats:
    - html
    - json

server:
  # The official image replaces this placeholder from SEARXNG_SECRET at startup.
  secret_key: "ultrasecretkey"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
